<script>
const T=THREE,SW=3,W=12,D=7,FH=3.2,MAXF=8,Y0=.1;

[-3.6,3.6].forEach(x=>{const p=new T.Mesh(new T.PlaneGeometry(4.8,FH-.2),glass);p.position.set(x,FH/2,D/2);hotel.add(p);box(4.8,.1,.1,gold,x,FH-.1,D/2);});

 box(W+.6,.25,D+.6,slab,0,y,0);box(W,FH,.2,wall,0,y+FH/2,-D/2);box(.2,FH,D,wall,-W/2,y+FH/2,0);box(.2,FH,D,wall,W/2,y+FH/2,0);
 box(.3,FH,.3,gold,-W/2,y+FH/2,D/2);box(.3,FH,.3,gold,W/2,y+FH/2,D/2);box(W,.06,.06,gold,0,y+.55,D/2);{const r=new T.Mesh(new T.PlaneGeometry(W,.5),glass);r.position.set(0,y+.3,D/2);hotel.add(r)}
 for(let k=1;k<4;k++)box(.12,FH,5,wall,-W/2+SW*k,y+FH/2,-1);

  const hit=new T.Mesh(new T.BoxGeometry(SW-.3,FH-.4,D-.6),new T.MeshBasicMaterial({color:0x4fc3f7,transparent:true,opacity:.16,depthWrite:false}));
  hit.position.set(cx,y+FH/2,0);hotel.add(hit);const s={f,i,cx,y:y+.13,type:0,lvl:0,hit,g:null,rsv:false};hit.userData.s=s;slots.push(s)}
 // elevator shaft (inside front-left corridor)
 if(shaft)hotel.remove(shaft);shaft=new T.Group();const H=(nF+1)*FH;
 const sg=new T.Mesh(new T.BoxGeometry(1.2,H,1.2),glass);sg.position.set(-5.2,H/2,2.7);shaft.add(sg);
 [[-.6,-.6],[.6,-.6],[-.6,.6],[.6,.6]].forEach(p=>box(.08,H,.08,gold,-5.2+p[0],H/2,2.7+p[1],shaft));hotel.add(shaft);
 // roof + sign

 box(W+1,.35,D+1,slab,0,ry,0,roof);box(W+1,.5,.2,gold,0,ry+.4,D/2+.4,roof);[[-4,-2],[-2.5,-2],[3,-1.5]].forEach(p=>box(1.2,.8,1,M(0x9aa0a6,.5,.6),p[0],ry+.55,p[1],roof));
 const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');x.fillStyle='#14161e';x.fillRect(0,0,512,128);

 if(s.g)hotel.remove(s.g);const g=s.g=new T.Group();g.position.set(s.cx,s.y,0);hotel.add(g);const t=s.type,L=s.lvl;

 const bw=[0,1,1.5,1.9][t];box(bw+.1,.45,2.1,wood,0,.22,-2.3,g);box(bw,.25,2,white,0,.57,-2.3,g);

 (t>1?[-1,1]:[0]).forEach(k=>box(bw*(t>1?.4:.7),.12,.45,white,k*bw*.23,.75,-3.0,g));
 box(.4,.4,.4,wood,bw/2+.4,.2,-3.1,g);ball(.13,lamp,bw/2+.4,.58,-3.1,g);
 [-1.15,1.15].forEach(k=>box(.4,1.8,.1,M(0xa13a4a,.95),k,1.95,-3.3,g));box(2.9,.06,.06,gold,0,2.9,-3.3,g);
 const cl=new T.Mesh(new T.CylinderGeometry(.35,.35,.06,20),lamp);cl.position.y=FH-.4;g.add(cl);
 box(1.1,.65,.06,M(0x0c0e12,.2,.6),SW/2-.1,1.5,-.5,g).rotation.y=-Math.PI/2;
 if(t>1){box(1.3,.4,.6,M(0x4a5f6a,.8),-.6,.2,.9,g);box(1.3,.5,.15,M(0x4a5f6a,.8),-.6,.6,1.15,g);}
 if(t>2){box(.9,.05,.9,wood,.8,.45,.6,g);box(.1,.45,.1,wood,.8,.2,.6,g);ball(.35,green,1.1,.9,-.6,g);box(.4,.4,.4,white,1.1,.2,-.6,g);}
 if(L>1)box(SW-.2,.06,.06,gold,0,2.9,-3.4,g);if(L>2)ball(.18,lamp,0,2.8,-1,g);

// ---- guests
const guests=[],skins=[0xf1c9a5,0xd9a47c,0x8d5a3b,0xffdcbc];
function mkGuest(){const g=new T.Group(),c=new T.Color().setHSL(Math.random(),.5,.45);
 const b=new T.Mesh(new T.CylinderGeometry(.2,.24,.75,10),M(c,.8));b.position.y=.55;

 [b,h,l].forEach(o=>{o.castShadow=true;g.add(o)});scene.add(g);return g}
function path(s,car){const V=(x,y,z)=>new T.Vector3(x,y,z);
 const a=[V(rnd([-9,-5,5,9]),Y0,13),V(0,Y0,9),V(0,Y0,3.4),V(-5.2,Y0,3.4),V(-5.2,Y0,2.7),V(-5.2,s.y,2.7),V(s.cx,s.y,2.7),V(s.cx,s.y,.4)];

// ---- state
let money=250000,rating=3.5,day=.33,lastDay=0,arr=0,spd=1,mult=1,hudT=0;

 $('cR').textContent='⭐ '+rating.toFixed(1);$('cO').textContent='🛏 '+o+'/'+built();$('bP').textContent='¥×'+mult.toFixed(1)}
function sim(g){
 day+=g/50;const di=day|0;
 if(di>lastDay){lastDay=di;const c=INF()*(3000+1500*built()+Math.round(2900*(S.clean+S.conc))+1500*(F.rest+F.pool)+fxU()+Math.round(occ()*600*[1,1.3,1,1.4][season]));money-=c;LG.av=(LG.av||0)+built();LG.exp+=c;daily(di);if(di%10==0)settle();toast('経費 −¥'+fmt(c));if(money<-100000){spd=0;toast('倒産しました… 再読み込みで再開')}}
 const vac=slots.filter(s=>s.type&&!s.rsv&&!(s.rdy>day)),dem=Math.max(.1,rating/3.5*Math.min(1.5,Math.max(.5,Math.pow(RV/mult,.8))))*(1+.15*F.rest+.2*F.pool+.1*S.conc+fxD())*ev.m*((day|0)%7>4?1.3:1)*adM()*SM[season]*[1,.95,.8][wx]*(1+brand/150);
 arr+=g*dem*(.05+.03*built())*hw();
 if(arr>=1){arr=0;if(vac.length){const car=Math.random()<.35,full=car&&(!F.park||guests.filter(x=>x.car).length>=16);if(full){if(Math.random()<.3)toast('🚗 満車・駐車場なしで客を逃しました')}else{const sg=pickSeg(),cd=vac.filter(x=>price(x)<=sg.bud*INF()*(.8+Math.random()*.4));if(!cd.length){if(Math.random()<.25)toast('💴 '+sg.n+'客：料金が合わず予約なし')}else{const s=cd.sort((a,b)=>Math.abs(a.type-sg.pref)-Math.abs(b.type-sg.pref)||Math.random()-.5)[0];s.rsv=true;s.seg=sg;s.nt=sg.n2[0]+(Math.random()*(sg.n2[1]-sg.n2[0]+1)|0);const q={s,car,m:mkGuest(),p:path(s,car),i:1,st:'in'};q.m.position.copy(q.p[0]);guests.push(q);s.gst=q}}}}

}

 const sat=Math.max(0,Math.min(1,.45+.13*(s.type-1)+.1*(s.lvl-1)+(1-mult)*.5+((s.cond==null?1:s.cond)-1)*.35-Math.max(0,occ()/(1+S.clean*3)-3)*.04+S.clean*.03+F.rest*.07+F.pool*.07+fxS()+(Math.random()-.5)*.3));const fr=F.rest*800+F.pool*500+fxR();LG.rev+=fr;money+=fr;rating=rating*.9+(1+4*sat)*.1;if(Math.random()<.18)review(sat)}
function walk(g){for(let k=guests.length-1;k>=0;k--){const q=guests[k];if(q.st=='stay')continue;

 else{d.multiplyScalar(st/L);q.m.position.add(d);if(Math.hypot(d.x,d.z)>1e-4)q.m.rotation.y=Math.atan2(d.x,d.z);q.m.children[0].rotation.z=Math.sin(performance.now()/110+k)*.08}}}

 '<div class="r" style="margin-top:8px"><button data-l>借りる ¥100,000</button><button data-r>返済 ¥100,000</button><button data-i>火災・事故保険：'+(ins?'加入中（タップで解約）':'未加入（¥6,000/決算）')+'</button><button data-c>閉じる</button></div>';
 e.onclick=q=>{const b=q.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.c!==undefined){e.style.display='none';return}
  if(d.l!==undefined){if(limit()<100000)return toast('融資枠不足（格付・担保）');money+=100000;debt+=100000}
  if(d.r!==undefined){const a=Math.min(100000,debt,Math.floor(money/1000)*1000);if(a<=0)return toast('返済できません');money-=a;debt-=a}
  if(d.i!==undefined)ins=ins?0:1;
  finance();hud()}}
function buildFac(k){const g=new T.Group();scene.add(g);
 if(k=='rest'){g.position.set(-14,0,-1);box(6,3,5,wall,0,1.5,-.1,g);box(6.4,.3,5.4,M(0x8a2f2f,.7),0,3.15,0,g);
  const gl=new T.Mesh(new T.PlaneGeometry(5,2.2),glass);gl.position.set(0,1.5,2.45);g.add(gl);box(5.2,.1,.1,gold,0,2.65,2.45,g);box(2.6,.8,.1,M(0x14161e),0,3.9,2.4,g);
  [-1.6,0,1.6].forEach(x=>{box(.9,.06,.9,white,x,.8,3.5,g);box(.08,.8,.08,gold,x,.4,3.5,g)})}
 else if(k=='park')mkPark(g);else if(FD[k])mkFac(k,g);
 else{g.position.set(13,0,5);box(9,.2,6,M(0xe9e2d3,.9),0,.1,0,g);
  const w=new T.Mesh(new T.BoxGeometry(6,.05,3.4),M(0x2aa6d6,.05,.2,{transparent:true,opacity:.8,emissive:0x0a4a6a,emissiveIntensity:.4}));w.position.set(0,.24,0);g.add(w);
  [[-3.2,2.2],[-1.8,2.2],[3.2,-2.2]].forEach(p=>box(.6,.15,1.5,white,p[0],.3,p[1],g));
  box(.08,1.8,.08,gold,-2.5,1,2.2,g);const pa=new T.Mesh(new T.ConeGeometry(.9,.4,12),M(0xd8503a));pa.position.set(-2.5,1.9,2.2);pa.castShadow=true;g.add(pa)}}
function staffMesh(k){const m=mkGuest();m.children[0].material=M(k=='clean'?0x2f6f9f:0x1c1f2b,.7);
 k=='clean'?m.position.set(-2+Math.random()*4,Y0,3.6):m.position.set(2+Math.random()*1.2,Y0,-2.9);m.userData.k=k;sMesh.push(m)}
function menu(){const e=$('sheet');e.style.display='block';
 const fb=(k,n)=>'<button data-f="'+k+'">'+n+(F[k]?'　✔ 営業中':'　建設費 ¥'+fmt(FC[k]))+'</button>';
 const sb=(k,n,d)=>'<button data-h="'+k+'">'+n+'　'+S[k]+'人（雇用 ¥10,000／日給 ¥2,500）<br><small>'+d+'</small></button>';
 e.innerHTML='<h3>施設</h3><div class="r">'+fb('rest','🍽 レストラン（満足度+／宿泊ごと売上）')+fb('park','🅿 駐車場（車で来る客を受け入れ・16台）')+fb('pool','🏊 プール（満足度+／集客+）')+Object.keys(FD).map(k=>fb(k,FD[k].n+'（'+FD[k].d+'）')).join('')+'</div><h3 style="margin-top:10px">スタッフ</h3><div class="r">'+sb('clean','清掃スタッフ','満足度アップ（最大5人）')+sb('conc','コンシェルジュ','集客アップ（最大3人）')+'</div><div class="r" style="margin-top:8px"><button data-c>閉じる</button><button data-z>最初からやり直す</button></div>';
 e.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.c!==undefined){e.style.display='none';return}
  if(d.z!==undefined){noSave=1;try{localStorage.removeItem('ght')}catch(x){}location.reload();return}
  if(d.f!==undefined){const k=d.f;if(F[k])return;if(money<FC[k])return toast('資金不足');money-=FC[k];F[k]=1;buildFac(k);toast('完成しました！')}
  if(d.h!==undefined){const k=d.h;if(S[k]>=(k=='clean'?5:3))return toast('上限です');if(money<10000)return toast('資金不足');money-=10000;S[k]++;staffMesh(k)}
  menu();hud()}}
function save(){if(noSave)return;try{localStorage.setItem('ght',JSON.stringify({money,rating,day,lastDay,mult,nF,F,S,debt,ins,LG,LP,ev,ads,brand,ach,RV,s:slots.map(s=>[s.type,s.lvl,s.cond])}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('ght'));if(!d)return false;
 ({money,rating,day,lastDay,mult}=d);debt=d.debt||0;ins=d.ins||0;LG=d.LG||LG;LP=d.LP||null;ev=d.ev||ev;ads=d.ads||{};brand=d.brand||0;ach=d.ach||{};RV=d.RV||1;Object.assign(F,d.F);Object.assign(S,d.S);while(nF<d.nF)addFloor();
 d.s.forEach((v,i)=>{if(v[0]&&slots[i]){slots[i].type=v[0];slots[i].lvl=v[1];slots[i].cond=v[2];furnish(slots[i])}});
 Object.keys(F).forEach(k=>F[k]&&buildFac(k));['clean','conc'].forEach(k=>{for(let i=0;i<S[k];i++)staffMesh(k)});return true}catch(e){return false}}
addEventListener('resize',resize);resize();addFloor();const ld=load();bF();hud();toast(ld?'セーブデータを読み込みました':'空き部屋をタップして客室を建てよう');
$('bX').onclick=menu;$('bB').onclick=finance;$('bA').onclick=adMenu;setInterval(save,4000);addEventListener('visibilitychange',save);addEventListener('pagehide',save);
let last=performance.now();
(function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.1);last=now;const g=dt*spd;
 if(g>0){sim(g);walk(g)}rainTick(dt);car.position.x=((car.position.x+60+dt*8)%120)-60;light();setCam();hudT+=dt;if(hudT>.2){hudT=0;hud()}renderer.render(scene,cam)})(last);
</script></body></html>
