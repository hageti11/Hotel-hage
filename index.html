<script>
const T=THREE,SW=3,W=12,D=7,FH=3.2,MAXF=8,Y0=.1;
const $=i=>document.getElementById(i),fmt=n=>Math.round(n).toLocaleString('ja-JP'),rnd=a=>a[Math.random()*a.length|0];
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;renderer.outputEncoding=T.sRGBEncoding;
document.body.appendChild(renderer.domElement);
const scene=new T.Scene(),cam=new T.PerspectiveCamera(42,1,.1,300);scene.fog=new T.Fog(0x9fd0ff,60,170);
const hemi=new T.HemisphereLight(0xcfe6ff,0x4a5a3a,.8),sun=new T.DirectionalLight(0xfff1d6,2.2);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0004;
Object.assign(sun.shadow.camera,{left:-26,right:26,top:30,bottom:-20,far:140});scene.add(hemi,sun,sun.target);
const M=(c,r=.7,m=0,o={})=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:r,metalness:m},o));

function box(w,h,d,m,x,y,z,p){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;(p||hotel).add(o);return o}

const wall=M(0xf3ece0,.9),slab=M(0xd6cfc0,.8),gold=M(0xc8963e,.3,.9),wood=M(0x5b4636,.6),white=M(0xf4f1ea,.9),

const plane=(w,d,c,x,z,y)=>{const o=new T.Mesh(new T.PlaneGeometry(w,d),M(c,.95));o.rotation.x=-Math.PI/2;o.position.set(x,y,z);o.receiveShadow=true;scene.add(o)};
plane(200,5,0x2c2f36,0,19,.02);plane(200,5,0xb8b3a8,0,12,.03);plane(8,6,0xc9c3b6,0,6.5,.03);
for(let i=-90;i<90;i+=6)plane(2.2,.18,0xeeeeee,i,19,.03);

 const t=new T.Mesh(new T.CylinderGeometry(.2,.3,2,8),wood);t.position.y=1;t.castShadow=true;g.add(t);
 ball(1.3,green,0,3,0,g);ball(1,M(0x4b8a44,.9),.6,3.7,.3,g);scene.add(g)}
[[-28,8],[-27,-9],[15,-9],[20,13],[-10,-6],[10,-6],[-27,14],[44,-9],[-16,16],[17,15]].forEach(p=>tree(p[0],p[1],.9+Math.random()*.5));
const car=new T.Group();box(3.4,.7,1.6,M(0xb3262c,.3,.5),0,.6,0,car);box(1.8,.6,1.4,M(0x222a33,.2,.3),-.1,1.2,0,car);
[[-1.1,.7],[1.1,.7],[-1.1,-.7],[1.1,-.7]].forEach(p=>{const w=new T.Mesh(new T.CylinderGeometry(.35,.35,.3,14),M(0x111111));w.rotation.x=Math.PI/2;w.position.set(p[0],.35,p[1]);car.add(w)});
car.position.set(-60,0,20);scene.add(car);
// ---- lobby
box(W+.6,.25,D+.6,slab,0,0,0);box(W,FH,.2,wall,0,FH/2,-D/2);box(.2,FH,D,wall,-W/2,FH/2,0);box(.2,FH,D,wall,W/2,FH/2,0);
box(W+.6,.06,D+.6,M(0xcbbfa8,.35,.1),0,.14,0);
[-3.6,3.6].forEach(x=>{const p=new T.Mesh(new T.PlaneGeometry(4.8,FH-.2),glass);p.position.set(x,FH/2,D/2);hotel.add(p);box(4.8,.1,.1,gold,x,FH-.1,D/2);});
box(12,.08,.1,gold,0,.2,D/2);box(.3,FH,.3,gold,-W/2,FH/2,D/2);box(.3,FH,.3,gold,W/2,FH/2,D/2);box(.2,FH,.2,gold,0,FH/2,D/2);
box(3.2,1.1,.8,M(0x3a2a20,.4,.2),2.5,.7,-2);box(3.3,.08,.9,M(0xe8e1d4,.2,.3),2.5,1.28,-2);
[-2.6,-.4].forEach(x=>{box(1.8,.45,.8,M(0x2f4a5a,.8),x,.4,-1.5);box(1.8,.5,.2,M(0x2f4a5a,.8),x,.8,-1.9)});

box(6,.18,3.4,gold,0,FH+.05,D/2+1.6);[-2.7,2.7].forEach(x=>box(.22,FH,.22,gold,x,FH/2,D/2+3));

// ---- floors / rooms
const BASE=[0,5000,11000,24000],COST=[0,60000,150000,350000],NAME=['','スタンダード','デラックス','スイート'];
const slots=[];let nF=0,roof,shaft;
function addFloor(){
 nF++;const f=nF,y=f*FH,g=hotel;

 box(.3,FH,.3,gold,-W/2,y+FH/2,D/2);box(.3,FH,.3,gold,W/2,y+FH/2,D/2);box(W,.06,.06,gold,0,y+.55,D/2);{const r=new T.Mesh(new T.PlaneGeometry(W,.5),glass);r.position.set(0,y+.3,D/2);hotel.add(r)}
 for(let k=1;k<4;k++)box(.12,FH,5,wall,-W/2+SW*k,y+FH/2,-1);
 for(let i=0;i<4;i++){const cx=-W/2+SW*(i+.5);
  const w=new T.Mesh(new T.PlaneGeometry(1.8,1.4),glass);w.position.set(cx,y+1.9,-D/2+.11);hotel.add(w);box(2,.08,.08,gold,cx,y+2.62,-D/2+.12);box(2,.08,.1,gold,cx,y+1.18,-D/2+.12);box(.08,1.4,.08,gold,cx-.95,y+1.9,-D/2+.12);box(.08,1.4,.08,gold,cx+.95,y+1.9,-D/2+.12);
  const hit=new T.Mesh(new T.BoxGeometry(SW-.3,FH-.4,D-.6),new T.MeshBasicMaterial({color:0x4fc3f7,transparent:true,opacity:.16,depthWrite:false}));
  hit.position.set(cx,y+FH/2,0);hotel.add(hit);const s={f,i,cx,y:y+.13,type:0,lvl:0,hit,g:null,rsv:false,ox:OX,par:hotel};hit.userData.s=s;slots.push(s)}
 // elevator shaft (inside front-left corridor)
 if(shaft)hotel.remove(shaft);shaft=new T.Group();const H=(nF+1)*FH;
 const sg=new T.Mesh(new T.BoxGeometry(1.2,H,1.2),glass);sg.position.set(-5.2,H/2,2.7);shaft.add(sg);
 [[-.6,-.6],[.6,-.6],[-.6,.6],[.6,.6]].forEach(p=>box(.08,H,.08,gold,-5.2+p[0],H/2,2.7+p[1],shaft));hotel.add(shaft);
 // roof + sign
 if(roof)hotel.remove(roof);roof=new T.Group();const ry=(nF+1)*FH;hotel.add(roof);
 box(W+1,.35,D+1,slab,0,ry,0,roof);box(W+1,.5,.2,gold,0,ry+.4,D/2+.4,roof);[[-4,-2],[-2.5,-2],[3,-1.5]].forEach(p=>box(1.2,.8,1,M(0x9aa0a6,.5,.6),p[0],ry+.55,p[1],roof));
 const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');x.fillStyle='#14161e';x.fillRect(0,0,512,128);
 x.strokeStyle='#c8963e';x.lineWidth=6;x.strokeRect(6,6,500,116);x.fillStyle='#e8c070';x.font='bold 64px Georgia,serif';x.textAlign='center';x.textBaseline='middle';x.fillText('GRAND HOTEL',256,68);
 const tx=new T.CanvasTexture(c);tx.encoding=T.sRGBEncoding;const sn=new T.Mesh(new T.PlaneGeometry(7,1.75),new T.MeshBasicMaterial({map:tx}));sn.position.set(0,ry+1.6,D/2-.2);roof.add(sn);
 box(7.2,1.95,.2,gold,0,ry+1.6,D/2-.35,roof);
 C.ty=Math.max(C.ty,(nF+1)*FH/2);bF();
}
function furnish(s){
 if(s.g)s.par.remove(s.g);const g=s.g=new T.Group();g.position.set(s.cx,s.y,0);s.par.add(g);const t=s.type,L=s.lvl;
 box(SW-.15,.04,5,M([0,0x8a6f5a,0x3e5c7a,0x6b2f3a][t],1),0,.02,-1,g);
 const bw=[0,1,1.5,1.9][t];box(bw+.1,.45,2.1,wood,0,.22,-2.3,g);box(bw,.25,2,white,0,.57,-2.3,g);
 box(bw,.06,1.1,M(0x9a3b3b+t*0x1a0a00,.9),0,.72,-1.8,g);box(bw+.2,1.1,.12,wood,0,.8,-3.4,g);
 (t>1?[-1,1]:[0]).forEach(k=>box(bw*(t>1?.4:.7),.12,.45,white,k*bw*.23,.75,-3.0,g));
 box(.4,.4,.4,wood,bw/2+.4,.2,-3.1,g);ball(.13,lamp,bw/2+.4,.58,-3.1,g);
 [-1.15,1.15].forEach(k=>box(.4,1.8,.1,M(0xa13a4a,.95),k,1.95,-3.3,g));box(2.9,.06,.06,gold,0,2.9,-3.3,g);
 const cl=new T.Mesh(new T.CylinderGeometry(.35,.35,.06,20),s.lm=lamp.clone());cl.position.y=FH-.4;g.add(cl);
 box(1.1,.65,.06,M(0x0c0e12,.2,.6),SW/2-.1,1.5,-.5,g).rotation.y=-Math.PI/2;
 if(t>1){box(1.3,.4,.6,M(0x4a5f6a,.8),-.6,.2,.9,g);box(1.3,.5,.15,M(0x4a5f6a,.8),-.6,.6,1.15,g);}
 if(t>2){box(.9,.05,.9,wood,.8,.45,.6,g);box(.1,.45,.1,wood,.8,.2,.6,g);ball(.35,green,1.1,.9,-.6,g);box(.4,.4,.4,white,1.1,.2,-.6,g);}
 box(.5,.05,1.3,wood,-1.2,.75,-.3,g);[[-1.4,-.9],[-1,-.9],[-1.4,.3],[-1,.3]].forEach(a=>box(.05,.75,.05,wood,a[0]+.1,.37,a[1],g));box(.4,.4,.4,M(0x2f3a4a),-.7,.4,-.3,g);box(.08,.5,.4,M(0x2f3a4a),-.52,.7,-.3,g);box(.3,.02,.22,M(0x1a1a1a),-1.2,.79,-.3,g);box(.02,.2,.28,M(0x223344,.2,.5),-1.33,.9,-.3,g);box(.4,1.9,.5,M(0x8a6a4a,.7),-1.25,.95,-3.2,g);box(.45,.6,.45,M(0xdddddd,.4,.3),1.2,.3,-.9,g);
 if(L>1)box(SW-.2,.06,.06,gold,0,2.9,-3.4,g);if(L>2)ball(.18,lamp,0,2.8,-1,g);
 s.hit.material.opacity=0;
}
// ---- guests
const guests=[],skins=[0xf1c9a5,0xd9a47c,0x8d5a3b,0xffdcbc];
function mkGuest(){const g=new T.Group(),c=new T.Color().setHSL(Math.random(),.5,.45);
 const b=new T.Mesh(new T.CylinderGeometry(.2,.24,.75,10),M(c,.8));b.position.y=.55;
 const h=new T.Mesh(new T.SphereGeometry(.17,12,10),M(rnd(skins),.7));h.position.y=1.08;

 [b,h,l].forEach(o=>{o.castShadow=true;g.add(o)});scene.add(g);return g}
function path(s,car){const O=s.ox||0;const V=(x,y,z)=>new T.Vector3(x,y,z);
 const a=[V(rnd([-9,-5,5,9]),Y0,13),V(O,Y0,9),V(O,Y0,3.4),V(O-5.2,Y0,3.4),V(O-5.2,Y0,2.7),V(O-5.2,s.y,2.7),V(O+s.cx,s.y,2.7),V(O+s.cx,s.y,.4)];
 if(car)a.splice(0,1,V(28,Y0,-3),V(28,Y0,9));return a}
// ---- state
let money=250000,rating=3.5,day=.33,lastDay=0,arr=0,spd=1,mult=1,hudT=0;
const built=()=>slots.filter(s=>s.type).length;
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,1800)}
const price=s=>BASE[s.type]*mult*(1+.35*(s.lvl-1));
function bF(){const c=40000*nF;$('bF').textContent=nF>=MAXF?'最上階':'増築 ¥'+fmt(c)}
function hud(){pk();$('cL').textContent='🏅 Lv.'+lvl+(combo>1?'　🔥コンボ×'+combo:'')+'　次のランクまで¥'+fmt(Math.max(0,Math.pow(lvl+1,2)*60000-totRev));$('cB').textContent='🏦 ¥'+fmt(debt)+' '+['🌸','☀️','🍁','⛄'][season]+['☀','☁','🌧'][wx]+' 知名度'+brand.toFixed(0)+(ev.n?'　'+ev.n:'');const h=(day%1)*24|0,m=(day%1)*1440%60|0,o=slots.filter(s=>s.rsv).length;
 $('cM').textContent='💰 ¥'+fmt(money);$('cD').textContent='📅 '+(day|0)+'日目 '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
 $('cR').textContent='⭐ '+rating.toFixed(1);$('cO').textContent='🛏 '+o+'/'+built();$('bP').textContent='¥×'+mult.toFixed(1)}
function sim(g){
 day+=g/50;const di=day|0;
 if(di>lastDay){lastDay=di;const c=INF()*(3000+1500*built()+Math.round(2900*(S.clean+S.conc))+1500*(F.rest+F.pool)+fxU()+Math.round(occ()*600*[1,1.3,1,1.4][season]));money-=c;LG.av=(LG.av||0)+built();LG.exp+=c;daily(di);if(di%10==0)settle();toast('経費 −¥'+fmt(c));if(money<-100000){spd=0;toast('倒産しました… 再読み込みで再開')}}
 const vac=slots.filter(s=>s.type&&!s.rsv&&!(s.rdy>day)),dem=Math.max(.1,rating/3.5*Math.min(1.5,Math.max(.5,Math.pow(RV/mult,.8))))*(1+.15*F.rest+.2*F.pool+.1*S.conc+fxD())*ev.m*((day|0)%7>4?1.3:1)*adM()*(((day|0)%40>29&&(day|0)%40<34)?1.4:1)*SM[season]*[1,.95,.8][wx]*(1+brand/150);
 arr+=g*dem*(.05+.03*built())*hw();
 if(arr>=1){arr=0;if(vac.length){const car=Math.random()<.35,full=car&&(!F.park||guests.filter(x=>x.car).length>=16);if(full){if(Math.random()<.3)toast('🚗 満車・駐車場なしで客を逃しました')}else{const sg=pickSeg(),cd=vac.filter(x=>price(x)<=sg.bud*INF()*(.8+Math.random()*.4));if(!cd.length){if(Math.random()<.25)toast('💴 '+sg.n+'客：料金が合わず予約なし')}else{const s=cd.sort((a,b)=>Math.abs(a.type-sg.pref)-Math.abs(b.type-sg.pref)||Math.random()-.5)[0];s.rsv=true;s.seg=sg;s.nt=sg.n2[0]+(Math.random()*(sg.n2[1]-sg.n2[0]+1)|0);const q={s,car,m:mkGuest(),p:path(s,car),i:1,st:'in'};q.m.position.copy(q.p[0]);guests.push(q);s.gst=q}}}}
 slots.forEach(s=>{if(s.gst&&s.gst.st=='stay'&&day>=s.leave){const q=s.gst;q.st='out';q.p=q.p.slice().reverse();q.i=1;q.m.position.copy(q.p[0]);q.m.rotation.x=0;q.m.visible=true}});
}

 const sat=Math.max(0,Math.min(1,.45+.13*(s.type-1)+.1*(s.lvl-1)+(1-mult)*.5+((s.cond==null?1:s.cond)-1)*.35-Math.max(0,occ()/(1+S.clean*3)-3)*.04+S.clean*.03+trn*.02+F.rest*.07+F.pool*.07+fxS()+(Math.random()-.5)*.3));const fr=F.rest*800+F.pool*500+fxR();LG.rev+=fr;money+=fr;rating=rating*.9+(1+4*sat)*.1;if(Math.random()<.18)review(sat);cheer(q,pr+fr,sat)}
function walk(g){for(let k=guests.length-1;k>=0;k--){const q=guests[k];if(q.st=='stay'){life(q,g);continue}

 e.innerHTML='<h3>経理・銀行</h3>'+row('純資産',y(worth()))+row('現金',y(money))+row('資産（簿価）',y(assets()))+row('借入残高',y(debt))+row('金利／決算',(rate()*100).toFixed(1)+'%')+row('信用格付',grade())+row('追加借入可能額',y(limit()))+row('為替（円安指数）',FX.toFixed(2))+row('地価指数',landIdx.toFixed(2))+row('競合ホテル相場',RV.toFixed(2)+'（自社 '+mult.toFixed(1)+'）')+row('物価指数',INF().toFixed(2))+row('次の決算まで',n+'日')+
 '<div style="font-size:20px;letter-spacing:2px;margin-top:8px">利益推移 '+spark()+'</div><h3 style="margin-top:10px">前期決算</h3>'+(L?row('売上',y(L.rev))+row('経費・人件費',y(L.exp))+row('損害',y(L.evt))+row('利息',y(L.int))+row('税金（固定資産税・法人税）',y(L.tax))+row('保険料',y(L.ins))+row('消費税・OTA手数料',y((L.ct||0)+(L.oc||0)))+row('稼働率',Math.round(100*(L.nights||0)/(L.av||1))+'%')+row('ADR／RevPAR',y((L.rev||0)/(L.nights||1))+' / '+y((L.rev||0)/(L.av||1)))+row('純利益',y(L.prof))+row('元本返済(10%)',y(L.rep)):'<small>まだ決算がありません（10日ごと）</small>')+
 '<div class="r" style="margin-top:8px"><button data-l>借りる ¥100,000</button><button data-r>返済 ¥100,000</button><button data-i>火災・事故保険：'+(ins?'加入中（タップで解約）':'未加入（¥6,000/決算）')+'</button><button data-c>閉じる</button></div>';
 e.onclick=q=>{const b=q.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.c!==undefined){e.style.display='none';return}
  if(d.l!==undefined){if(limit()<100000)return toast('融資枠不足（格付・担保）');money+=100000;debt+=100000}
  if(d.r!==undefined){const a=Math.min(100000,debt,Math.floor(money/1000)*1000);if(a<=0)return toast('返済できません');money-=a;debt-=a}
  if(d.i!==undefined)ins=ins?0:1;
  finance();hud()}}
function buildFac(k){const g=new T.Group();scene.add(g);
 if(k=='rest'){g.position.set(-14,0,-1);box(6,3,5,wall,0,1.5,-.1,g);box(6.4,.3,5.4,M(0x8a2f2f,.7),0,3.15,0,g);
  const gl=new T.Mesh(new T.PlaneGeometry(5,2.2),glass);gl.position.set(0,1.5,2.45);g.add(gl);box(5.2,.1,.1,gold,0,2.65,2.45,g);box(2.6,.8,.1,M(0x14161e),0,3.9,2.4,g);
  [-1.6,0,1.6].forEach(x=>{box(.9,.06,.9,white,x,.8,3.5,g);box(.08,.8,.08,gold,x,.4,3.5,g)})}
 else if(k=='park')mkPark(g);else if(FD[k])mkFac(k,g);
 else{g.position.set(12,0,-11);box(9,.2,6,M(0xe9e2d3,.9),0,.1,0,g);
  const w=new T.Mesh(new T.BoxGeometry(6,.05,3.4),M(0x2aa6d6,.05,.2,{transparent:true,opacity:.8,emissive:0x0a4a6a,emissiveIntensity:.4}));w.position.set(0,.24,0);g.add(w);
  [[-3.2,2.2],[-1.8,2.2],[3.2,-2.2]].forEach(p=>box(.6,.15,1.5,white,p[0],.3,p[1],g));
  box(.08,1.8,.08,gold,-2.5,1,2.2,g);const pa=new T.Mesh(new T.ConeGeometry(.9,.4,12),M(0xd8503a));pa.position.set(-2.5,1.9,2.2);pa.castShadow=true;g.add(pa)}}
function staffMesh(k){const m=mkGuest();m.children[0].material=M(k=='clean'?0x2f6f9f:0x1c1f2b,.7);
 k=='clean'?m.position.set(-2+Math.random()*4,Y0,3.6):m.position.set(2+Math.random()*1.2,Y0,-2.9);m.userData.k=k;sMesh.push(m)}
function menu(){const e=$('sheet');e.style.display='block';
 const fb=(k,n)=>'<button data-f="'+k+'">'+n+(F[k]?'　✔ 営業中':'　建設費 ¥'+fmt(FC[k]))+'</button>';
 const sb=(k,n,d)=>'<button data-h="'+k+'">'+n+'　'+S[k]+'人（雇用 ¥10,000／日給 ¥2,500）<br><small>'+d+'</small></button>';
 e.innerHTML='<h3>施設</h3><div class="r">'+'<small>屋内施設（レストラン・スパ等）は空き区画をタップして建設</small>'+fb('park','🅿 駐車場（車で来る客を受け入れ・16台）')+fb('pool','🏊 プール（満足度+／集客+）')+Object.keys(FD).filter(k=>!IN[k]).map(k=>fb(k,FD[k].n+'（'+FD[k].d+'）')).join('')+'</div><h3 style="margin-top:10px">スタッフ</h3><div class="r">'+sb('clean','清掃スタッフ','満足度アップ（最大5人）')+sb('conc','コンシェルジュ','集客アップ（最大3人）')+'<button data-tr>🎓 スタッフ研修 Lv.'+trn+'（満足度+・離職↓）¥'+fmt(40000*(trn+1))+'</button>'+'</div><div class="r" style="margin-top:8px"><button data-c>閉じる</button><button data-z>最初からやり直す</button></div>';
 e.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.c!==undefined){e.style.display='none';return}
  if(d.z!==undefined){noSave=1;try{localStorage.removeItem('ght')}catch(x){}location.reload();return}
  if(d.ax!==undefined){const c=aS?60000*(aS.nF+1):400000;if(aS&&aS.nF>=6)return toast('上限です');if(money<c)return toast('資金不足');money-=c;if(!aS)buildAnnex();addAnnexFloor();toast('🏨 別館が完成!');confetti();beep(659,.2)}
  if(d.f!==undefined){const k=d.f;if(F[k])return;if(money<FC[k])return toast('資金不足');money-=FC[k];F[k]=1;buildFac(k);toast('完成しました！')}
  if(d.tr!==undefined){const c=40000*(trn+1);if(trn>=3)return toast('最大です');if(money<c)return toast('資金不足');money-=c;LG.exp+=c;trn++;toast('🎓 研修完了 Lv.'+trn)}
  if(d.h!==undefined){const k=d.h;if(S[k]>=(k=='clean'?5:3))return toast('上限です');if(money<10000)return toast('資金不足');money-=10000;S[k]++;staffMesh(k)}
  menu();hud()}}
function save(){if(noSave)return;try{localStorage.setItem('ght',JSON.stringify({money,rating,day,lastDay,mult,nF,F,S,debt,ins,LG,LP,ev,ads,brand,ach,RV,totRev,trn,hist,overdue,FX,land:PL.map(p=>[p.own,p.an?p.an.nF:-1]),landIdx,BRoff,s:slots.filter(s=>s.type||s.fac).map(s=>[s.ox||0,s.f,s.i,s.type,s.lvl,s.cond,s.fac])}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('ght'));if(!d)return false;
 ({money,rating,day,lastDay,mult}=d);debt=d.debt||0;ins=d.ins||0;LG=d.LG||LG;LP=d.LP||null;ev=d.ev||ev;ads=d.ads||{};brand=d.brand||0;ach=d.ach||{};RV=d.RV||1;totRev=d.totRev||0;lvl=lvlOf(totRev);Object.assign(F,d.F);Object.assign(S,d.S);while(nF<d.nF)addFloor();
 if(d.land)d.land.forEach((v,i)=>{const p=PL[i];if(p&&v[0]){p.own=1;markLand(p);if(v[1]>=0){buildAn(p);while(p.an.nF<v[1])addAn(p)}}});else if(d.anx>=0){PL[0].own=1;markLand(PL[0]);buildAn(PL[0]);while(PL[0].an.nF<d.anx)addAn(PL[0])}landIdx=d.landIdx||1;BRoff=d.BRoff||0;trn=d.trn||0;hist=d.hist||[];overdue=d.overdue||0;FX=d.FX||1;
 d.s.forEach((v,i)=>{let s,t,l,c,f;if(v.length>=7){s=slots.find(x=>(x.ox||0)==v[0]&&x.f==v[1]&&x.i==v[2]);t=v[3];l=v[4];c=v[5];f=v[6]}else{s=slots[i];t=v[0];l=v[1];c=v[2]}if(s&&(t||f)){s.type=t||0;s.lvl=l||0;s.cond=c;if(f){s.fac=f;furnishFac(s)}else furnish(s)}});Object.keys(IN).forEach(k=>{if(F[k]&&!slots.some(s=>s.fac==k)){F[k]=0;money+=FC[k]}});
 Object.keys(F).forEach(k=>F[k]&&!IN[k]&&buildFac(k));['clean','conc'].forEach(k=>{for(let i=0;i<S[k];i++)staffMesh(k)});return true}catch(e){return false}}
addEventListener('resize',resize);resize();addFloor();PL.forEach(markLand);const ld=load();bF();hud();toast(ld?'セーブデータを読み込みました':'空き部屋をタップして客室を建てよう');
$('bX').onclick=menu;$('bB').onclick=finance;addEventListener('pointerdown',()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}});$('bA').onclick=adMenu;$('bL').onclick=landMenu;setInterval(save,4000);addEventListener('visibilitychange',save);addEventListener('pagehide',save);
let last=performance.now();
(function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.1);last=now;const g=dt*spd;
 if(g>0){sim(g);walk(g)}rainTick(dt);popTick(dt);if(busM)busM.position.x=((busM.position.x+60-dt*6)%120+120)%120-60;car.position.x=((car.position.x+60+dt*8)%120)-60;light();setCam();hudT+=dt;if(hudT>.2){hudT=0;hud()}renderer.render(scene,cam)})(last);
</script></body></html>
